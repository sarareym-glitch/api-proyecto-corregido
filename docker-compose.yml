services:
  mysql:
    image: mysql:8.4
    container_name: tiendaya-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: tiendaya
      MYSQL_USER: tiendaya
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - tiendaya_data:/var/lib/mysql

volumes:
  tiendaya_data: