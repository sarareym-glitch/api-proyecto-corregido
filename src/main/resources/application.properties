spring.application.name=api
server.port=8001

# --- MySQL (se crea la base "tiendaya" si no existe) ---
# Las credenciales por defecto son las de docker-compose.yml; se pueden sobrescribir
# con las variables de entorno DB_URL, DB_USERNAME y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tiendaya?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:tiendaya}
spring.datasource.password=${DB_PASSWORD:tiendaya123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
